<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/K-removebg-preview.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No static <title>/<meta description>/OG title-description/<link canonical> here on
      purpose: <Seo> (src/components/Seo.jsx, react-helmet-async) sets all of those per
      route, and the postbuild prerender step bakes the result into each route's static
      HTML. A static tag here would sit alongside Helmet's version instead of being
      replaced by it, producing duplicate <title>/meta tags in the prerendered output.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://idealab.kongunadu.ac.in/images.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Organization structured data (present site-wide, independent of client-side routing) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "EducationalOrganization",
        "name": "AICTE IDEA Lab",
        "alternateName": "Idea Development, Evaluation & Application Lab",
        "description": "AICTE IDEA Lab at Kongunadu College of Engineering and Technology, Trichy — a hub for innovation, prototyping, and interdisciplinary research.",
        "url": "https://idealab.kongunadu.ac.in/",
        "logo": "https://idealab.kongunadu.ac.in/idealab.webp",
        "email": "idealab@kongunadu.ac.in",
        "telephone": "+91-86800-02425",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Namakkal-Trichy Main Road, Tholurpatti",
          "addressLocality": "Trichy",
          "postalCode": "621215",
          "addressRegion": "Tamil Nadu",
          "addressCountry": "IN"
        },
        "parentOrganization": {
          "@type": "CollegeOrUniversity",
          "name": "Kongunadu College of Engineering and Technology",
          "sameAs": [
            "https://www.facebook.com/KongunaduCollegeofEngineeringAndTechnology/",
            "https://x.com/Kongunadu_KNCET",
            "https://www.instagram.com/kongunadu_college_of_engineer/",
            "https://www.linkedin.com/school/kongunadu-college-of-engineering-and-technology/"
          ]
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Roboto:wght@300;400;500&family=Ubuntu:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
